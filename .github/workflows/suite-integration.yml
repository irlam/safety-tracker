name: Safety Tours Suite integration checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, gd, mbstring
      - name: PHP syntax
        run: |
          php -l api/suite-summary.php
          php -l api/suite-references.php
          php -l includes/auth.php
          php -l tests/suite-integration.php
          php -l includes/branding.php
          php -l admin_branding.php
          php -l login_admin.php
          php -l includes/nav.php
          php -l includes/functions.php
          php -l pdf.php
          php -l dashboard.php
          php -l actions.php
          php -l admin_users.php
          php -l tests/branding-regression.php
          php -l form.php
          php -l edit.php
          php -l action_view.php
          php -l how_it_works.php
          php -l includes/checklist.php
      - name: Check integration and security regression
        run: php tests/suite-integration.php
      - name: PWA service worker JavaScript syntax
        run: node --check service-worker.js
      - name: Branding and PDF production checks
        run: php tests/branding-regression.php
